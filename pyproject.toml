[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-docs"
version = "1.0.0"
description = "Fast static documentation generator with search, versioning, and zero-config setup"
requires-python = ">=3.14"
license = {file="LICENSE.md"}
dependencies = [
    "fastpylight>=0.1.18",
    "markdown",
    "xxhash>=4.0.1",
    "zstandard",
]

[project.scripts]
fr-docs = "fr_docs.build:main"

[tool.setuptools.packages.find]
include = ["fr_docs*"]
