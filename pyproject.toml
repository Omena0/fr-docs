[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-docs"
version = "1.0.0"
description = "Fast static documentation generator with search, versioning, and zero-config setup"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE.md"}

authors = [
    {name = "Omena0"},
]

keywords = [
    "documentation",
    "documentation-generator",
    "static-site-generator",
    "markdown",
    "github-pages",
    "static-site",
    "docs",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "fastpylight>=0.1.18",
    "markdown",
    "xxhash>=4.0.1",
    "zstandard",
]

[project.urls]
Homepage = "https://omena0.dev/fr-docs/"
Documentation = "https://omena0.dev/fr-docs/"
Repository = "https://github.com/Omena0/fr-docs"
Issues = "https://github.com/Omena0/fr-docs/issues"

[project.scripts]
fr-docs = "fr_docs.build:main"

[tool.setuptools.packages.find]
include = ["fr_docs*"]

[tool.ruff.lint]
extend-select = [
    # Refactoring / simplification
    "SIM",       # flake8-simplify
    "C4",        # flake8-comprehensions
    "RET",       # flake8-return
    "PIE",       # flake8-pie
    "FURB",      # refurb

    # Modern Python
    "UP",        # pyupgrade
    "FA",        # future-annotations
    "I",         # isort

    # Bug / correctness detection
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "BLE",       # blind-except
    "PLE",       # pylint errors
    "S",         # flake8-bandit
    "TRY",       # tryceratops

    # Type / API quality
    "ANN",       # flake8-annotations
    "ARG",       # unused arguments
    "TC",        # type-checking imports
    "PYI",       # .pyi quality

    # Complexity / performance
    "C90",       # mccabe complexity
    "PERF",      # perflint
    "PLR",       # pylint refactoring

    # Python-specific style / quality
    "N",         # pep8-naming
    "SLF",       # private member access
    "SLOT",      # __slots__
    "ERA",       # commented-out code

    # Logging / strings / misc.
    "LOG",       # logging
    "G",         # logging format
    "ISC",       # implicit string concatenation
    "RSE",       # raise statements
    "EM",        # exception messages
]

extend-ignore = [
    "TRY300",
    "PLR2004",
    "S310",
    "S101",
    "S603",
    "S607",
    "ANN001",
    "ANN201",
    "ANN202",
    "G004"
]

mccabe.max-complexity = 15
pylint.max-branches = 15
pylint.max-statements = 200

fixable = ["ALL"]

