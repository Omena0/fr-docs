[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-docs"
version = "1.0.0"
description = "Fast static documentation generator with search, versioning, and zero-config setup"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE.md"}

authors = [
    {name = "Omena0"},
]

keywords = [
    "documentation",
    "documentation-generator",
    "static-site-generator",
    "markdown",
    "github-pages",
    "static-site",
    "docs",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "fastpylight>=0.1.18",
    "markdown",
    "xxhash>=4.0.1",
    "zstandard",
]

[project.urls]
Homepage = "https://omena0.dev/fr-docs/"
Documentation = "https://omena0.dev/fr-docs/"
Repository = "https://github.com/Omena0/fr-docs"
Issues = "https://github.com/Omena0/fr-docs/issues"

[project.scripts]
fr-docs = "fr_docs.__main__:main"

[tool.setuptools.packages.find]
include = ["fr_docs*"]

[tool.ruff.lint]
extend-select = [
    "A",
    "B",
    "BLE",
    "C4",
    "C90",
    "EM",
    "ERA",
    "FA",
    "FURB",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "PLR",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "SLOT",
    "TC",
    "UP",
]

extend-ignore = [
    "TRY300",
    "PLR2004",
    "S310",
    "S101",
    "S603",
    "S607",
    "G004",
    "RUF001",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
"fr_docs/build.py" = ["PLR0912", "PLR0915", "C901"]

fixable = ["ALL"]

[tool.mypy]
ignore_missing_imports = true


