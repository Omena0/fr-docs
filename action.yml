name: Build and Deploy fr-docs Site
description: >-
  Build a documentation site using fr-docs and deploy it to GitHub Pages.

inputs:
  python-version:
    description: 'Python version for fr-docs'
    required: false
    default: '3.14'
  node-version:
    description: 'Node.js version for npm tooling'
    required: false
    default: '22'
  docs-dir:
    description: 'Directory containing fr-docs config.json and src/'
    required: false
    default: 'docs'
  output-dir:
    description: 'Output directory for the built site'
    required: false
    default: 'docs/site'

runs:
  using: composite
  steps:
    - name: Prepare Python dependency manifest
      shell: bash
      run: |
        mkdir -p .fr-docs
        cat > .fr-docs/requirements.txt <<'EOF'
        fastpylight>=0.1.18
        markdown
        xxhash>=4.0.1
        zstandard
        EOF

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: .fr-docs/requirements.txt

    - name: Install Python dependencies
      shell: bash
      run: pip install -r .fr-docs/requirements.txt

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Node.js tools from fr-docs package.json
      shell: bash
      run: |
        mapfile -t npm_packages < <(
          node -e '
            const manifest = require(process.argv[1]);
            const dependencies = {
              ...(manifest.dependencies ?? {}),
              ...(manifest.devDependencies ?? {}),
            };

            for (const [name, version] of Object.entries(dependencies)) {
              console.log(`${name}@${version}`);
            }
          ' "$GITHUB_ACTION_PATH/package.json"
        )

        if ((${#npm_packages[@]} == 0)); then
          echo "::error::No npm dependencies found in fr-docs package.json"
          exit 1
        fi

        npm install \
          --prefix "$GITHUB_WORKSPACE" \
          --no-save \
          --no-package-lock \
          --no-audit \
          --no-fund \
          "${npm_packages[@]}"

    - name: Install fr-docs
      shell: bash
      run: pip install "$GITHUB_ACTION_PATH"

    - name: Build docs site
      shell: bash
      working-directory: ${{ inputs.docs-dir }}
      run: python -m fr_docs build --production

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.output-dir }}

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
